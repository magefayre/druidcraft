name: Setup
description: Setup Node and restore dependencies
runs:
  using: composite
  steps:
    - name: Node
      id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".nvmrc"
        cache: yarn
    - name: Install dependencies
      shell: bash
      run: yarn install
      env:
        HUSKY: 0
